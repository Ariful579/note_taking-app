<style>
/* ============ Design tokens ============ */
:root {
  --bg: #e5e8ee; --surface: #ffffff; --surface2: #f1f3f8; --surface3: #e8ebf3;
  --line: rgba(15, 23, 42, .09); --line2: rgba(15, 23, 42, .16);
  --text: #0f172a; --text2: #4a5568; --text3: #8792a6;
  --accent: #3b5bdb; --accent2: #2f4ac0; --accent-soft: rgba(59, 91, 219, .12); --on-accent: #fff;
  --danger: #e03131; --ok: #2f9e44;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .08);
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 10px 32px rgba(15, 23, 42, .16);
  --ink: #111827;
  --r: 14px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --topbar-h: 56px;
}
[data-theme="dark"] {
  --bg: #0d0f14; --surface: #1a1d25; --surface2: #232731; --surface3: #2c3140;
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .16);
  --text: #eef0f6; --text2: #adb4c4; --text3: #7b8498;
  --accent: #7b93ff; --accent2: #93a6ff; --accent-soft: rgba(123, 147, 255, .16); --on-accent: #0d1020;
  --danger: #ff6b6b; --ok: #51cf66;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 32px rgba(0, 0, 0, .55);
}

/* ============ Base ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
  font: 14px/1.35 system-ui, -apple-system, Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.ic .inkfill { fill: var(--ink); } .ic .inkstroke { stroke: var(--ink); }
.ic .soft { fill: currentColor; fill-opacity: .2; } .ic .solid { fill: currentColor; stroke: none; }

.ibtn {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text2);
  transition: background-color .12s, color .12s, transform .12s;
}
.ibtn:active { transform: scale(.92); background: var(--surface3); }
.ibtn:disabled { opacity: .32; pointer-events: none; }
@media (hover: hover) { .ibtn:hover { background: var(--surface2); color: var(--text); } }
.ibtn.on { background: var(--accent-soft); color: var(--accent); }

/* ============ Top bar ============ */
#topbar {
  position: absolute; left: 0; right: 0; top: 0; z-index: 20; height: calc(var(--topbar-h) + var(--safe-t));
  padding: var(--safe-t) calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));
  display: flex; align-items: center; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--line);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2, .8, .2, 1);
}
#tabs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
#tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; max-width: 210px; height: 38px; padding: 0 6px 0 12px; border-radius: 11px; display: flex; align-items: center; gap: 8px;
  color: var(--text2); font-weight: 500; transition: background-color .12s;
}
.tab .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--text3); }
.tab .x .ic { width: 15px; height: 15px; stroke-width: 2.2; }
.tab .x:active { background: var(--surface3); }
.tab.active { background: var(--surface2); color: var(--text); font-weight: 650; }
.tab.active .x { color: var(--text2); }
.tab:not(.active) .x { opacity: .55; }
#tabs .newtab { flex: none; width: 38px; height: 38px; }
.tbsep { width: 1px; height: 24px; background: var(--line2); margin: 0 4px; flex: none; }
.pagechip {
  height: 38px; padding: 0 12px; border-radius: 11px; background: var(--surface2); display: flex; align-items: baseline; gap: 4px;
  font-weight: 700; font-variant-numeric: tabular-nums; align-self: center; margin: 0 2px; line-height: 38px;
}
.pagechip small { color: var(--text3); font-weight: 600; font-size: 12px; }
.pagechip:active { background: var(--surface3); }
.savedot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin: 0 6px; opacity: 0; transition: opacity .3s; flex: none; }
.savedot.show { opacity: 1; }
.savedot.busy { background: #f59f00; opacity: 1; }

/* ============ Canvas workspace ============ */
#viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; contain: strict; background: var(--bg); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; --inv: 1; }
.page { position: absolute; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 8px 28px rgba(0, 0, 0, .10); contain: layout paint style; }
.page canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#live { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 7; pointer-events: none; display: none; }
.addcard {
  position: absolute; border: calc(2px * var(--inv)) dashed var(--line2); border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 12px;
  color: var(--text2); font-size: 22px; font-weight: 650; background: transparent; cursor: pointer; touch-action: manipulation;
}
.addcard .ic { width: 28px; height: 28px; stroke-width: 2; }
.addcard:active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* selection */
#selbox { position: absolute; z-index: 6; display: none; border: calc(1.6px * var(--inv)) dashed var(--accent); background: var(--accent-soft); pointer-events: none; border-radius: calc(3px * var(--inv)); }
#selbox .h { position: absolute; right: calc(-11px * var(--inv)); bottom: calc(-11px * var(--inv)); width: calc(22px * var(--inv)); height: calc(22px * var(--inv)); border-radius: 50%; background: var(--surface); border: calc(2.4px * var(--inv)) solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
#selbar { position: absolute; z-index: 15; display: none; gap: 2px; padding: 4px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); transform: translateX(-50%); }
#selbar .ibtn { width: 42px; height: 42px; }
#selbar .ibtn.danger { color: var(--danger); }
#eraserring { position: absolute; z-index: 8; pointer-events: none; border-radius: 50%; border: 1.5px solid var(--text); background: rgba(128, 128, 128, .12); box-shadow: 0 0 0 1px rgba(255, 255, 255, .7); display: none; left: 0; top: 0; will-change: transform; }

#pagetoast {
  position: absolute; z-index: 12; left: 50%; top: calc(var(--topbar-h) + var(--safe-t) + 14px); transform: translate(-50%, -6px); pointer-events: none;
  background: rgba(15, 23, 42, .82); color: #fff; padding: 7px 14px; border-radius: 20px; font-weight: 650; font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity .2s, transform .2s;
}
#pagetoast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============ Tool dock ============ */
#dock {
  position: absolute; z-index: 20; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 2px; padding: 8px 8px 0; height: 64px; max-width: calc(100% - 16px);
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--line);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2, .8, .2, 1);
}
#dock.free { transform: none; bottom: auto; }
#dock .grip { width: 22px; height: 50px; align-self: center; margin-top: -8px; display: grid; place-items: center; cursor: grab; touch-action: none; color: var(--text3); }
#dock .grip i { width: 4px; height: 22px; border-radius: 2px; background: currentColor; opacity: .5; box-shadow: 7px 0 0 currentColor; margin-right: 7px; }
#dock .tools { display: flex; align-items: flex-end; gap: 2px; height: 100%; overflow: hidden; }
.tool { position: relative; width: 52px; height: 56px; display: grid; place-items: end center; padding-bottom: 6px; color: var(--text2); transition: transform .2s cubic-bezier(.2, .9, .3, 1.2), color .12s; }
.tool .ic { width: 34px; height: 34px; stroke-width: 1.6; }
.tool:active { transform: scale(.94); }
.tool.active { color: var(--accent); transform: translateY(-9px); }
.tool.active::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 18px; height: 4px; border-radius: 3px; background: var(--accent); transform: translateX(-50%); }
.dbtn { width: 46px; height: 46px; align-self: center; margin-top: -8px; border-radius: 14px; display: grid; place-items: center; color: var(--text2); transition: background-color .12s, color .12s; position: relative; }
.dbtn:active { background: var(--surface3); }
.dbtn.on { background: var(--accent-soft); color: var(--accent); }
.dbtn .ic { width: 24px; height: 24px; }
.dbtn .badge { position: absolute; right: 5px; bottom: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
#dock .sep { width: 1px; height: 30px; background: var(--line2); align-self: center; margin: -8px 6px 0; }
.colorchip { width: 46px; height: 46px; align-self: center; margin-top: -8px; display: grid; place-items: center; border-radius: 14px; }
.colorchip:active { background: var(--surface3); }
.colorchip i { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 2px var(--line2); display: block; }
#dock.collapsed { padding: 6px; height: 56px; gap: 0; }
#dock.collapsed .tools, #dock.collapsed .sep, #dock.collapsed .grip, #dock.collapsed .dbtn:not(.expander), #dock.collapsed .colorchip { display: none; }
#dock .expander { display: none; }
#dock.collapsed .expander { display: grid; margin: 0; align-self: center; }
body.writing #topbar { opacity: 0; transform: translateY(-14px); pointer-events: none; }
body.writing #dock { opacity: 0; pointer-events: none; }
body.writing #dock:not(.free) { transform: translate(-50%, 14px); }
body.writing #selbar { opacity: 0; pointer-events: none; }

/* ============ Popovers / menus ============ */
#popover {
  position: fixed; z-index: 60; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px;
  min-width: 220px; max-width: min(92vw, 340px); max-height: min(80vh, 640px); overflow: auto; animation: pop .14s ease-out; transform-origin: var(--ox, 50%) var(--oy, 100%);
}
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(var(--dy, 6px)); } }
#popover.menu { padding: 6px; min-width: 240px; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 11px; text-align: left; font-weight: 520; color: var(--text); }
.mi .ic { width: 20px; height: 20px; color: var(--text2); }
.mi:active { background: var(--surface3); }
.mi.danger, .mi.danger .ic { color: var(--danger); }
.mi .sub { margin-left: auto; color: var(--text3); font-size: 12px; font-weight: 500; }
.mdiv { height: 1px; background: var(--line); margin: 5px 8px; }
.plabel { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin: 2px 2px 8px; }
.prow { display: flex; align-items: center; gap: 10px; }
.preview { height: 54px; border-radius: 12px; background: var(--surface2); margin-bottom: 12px; overflow: hidden; }
.preview canvas { width: 100%; height: 100%; display: block; }
.sliderrow { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sliderrow output { width: 34px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text2); }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 36px; background: transparent; touch-action: pan-x; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--surface3) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin-top: -10px; box-shadow: var(--shadow-sm); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface3); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 50%; background: var(--c); position: relative; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14); min-width: 34px; }
.sw.sel { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14), 0 0 0 2.5px var(--surface), 0 0 0 5px var(--accent); }
.sw:active { transform: scale(.9); }
.sw.custom { background: conic-gradient(#f03e3e, #fd7e14, #fcc419, #51cf66, #22b8cf, #4c6ef5, #be4bdb, #f03e3e); display: grid; place-items: center; overflow: hidden; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.sw.custom .ic { color: #fff; width: 16px; height: 16px; stroke-width: 2.6; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .5)); pointer-events: none; }
.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 9px 12px; border-radius: 9px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.shapegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.shapegrid button { display: grid; place-items: center; gap: 4px; padding: 12px 6px 9px; border-radius: 14px; background: var(--surface2); font-size: 12px; font-weight: 600; color: var(--text2); }
.shapegrid button .ic { width: 28px; height: 28px; }
.shapegrid button.on { background: var(--accent-soft); color: var(--accent); }
.hint { color: var(--text3); font-size: 12px; margin-top: 10px; line-height: 1.4; }

/* ============ Modal / sheets ============ */
#modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 12, 24, .48); animation: fade .16s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(100%, 720px); max-height: 88vh; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow); display: flex; flex-direction: column;
  animation: rise .22s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--safe-b);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet.dialog { width: min(92%, 440px); border-radius: 24px; align-self: center; margin-bottom: 0; }
.sheet.wide { width: min(100%, 900px); }
.sheet-h { display: flex; align-items: center; padding: 14px 12px 6px 22px; gap: 8px; }
.sheet-h h2 { flex: 1; font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.sheet-b { padding: 8px 22px 20px; overflow: auto; overscroll-behavior: contain; }
.sheet-f { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 22px 18px; }
.btn { height: 46px; padding: 0 20px; border-radius: 13px; font-weight: 650; background: var(--surface2); color: var(--text); display: inline-flex; align-items: center; gap: 8px; justify-content: center; transition: transform .1s, background-color .12s; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn .ic { width: 20px; height: 20px; }
.field { width: 100%; height: 50px; padding: 0 16px; border-radius: 13px; background: var(--surface2); border: 2px solid transparent; outline: none; font-size: 16px; }
.field:focus { border-color: var(--accent); background: var(--surface); }
.fl { font-size: 12px; font-weight: 700; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin: 18px 0 9px; }
.fl:first-child { margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 6px; justify-items: center; font-weight: 600; font-size: 12.5px; color: var(--text2); }
.tile canvas { width: 100%; aspect-ratio: 850/1100; border-radius: 8px; box-shadow: 0 0 0 1px var(--line2); display: block; }
.tile.sel canvas { box-shadow: 0 0 0 3px var(--accent); }
.tile.sel { color: var(--accent); }
.papers { display: flex; gap: 12px; flex-wrap: wrap; }
.papers .sw { width: 44px; min-width: 44px; flex: none; }
.row-opt { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-opt:last-child { border-bottom: 0; }
.row-opt .lbl { flex: 1; } .row-opt .lbl b { display: block; font-weight: 650; } .row-opt .lbl span { color: var(--text3); font-size: 12.5px; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--surface3); position: relative; flex: none; transition: background-color .15s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
.switch.on { background: var(--accent); } .switch.on::after { transform: translateX(20px); }
.colorrow { display: flex; gap: 12px; flex-wrap: wrap; }
.colorrow .sw { width: 38px; min-width: 38px; flex: none; }

/* page overview */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 16px; }
.pcard { position: relative; display: grid; gap: 7px; justify-items: center; }
.pcard .th { width: 100%; aspect-ratio: 850/1100; border-radius: 8px; background: var(--surface2); overflow: hidden; box-shadow: 0 0 0 1px var(--line2); position: relative; }
.pcard .th img { width: 100%; height: 100%; display: block; object-fit: cover; }
.pcard.cur .th { box-shadow: 0 0 0 3px var(--accent); }
.pcard .n { font-weight: 700; font-size: 12.5px; color: var(--text2); }
.pcard.cur .n { color: var(--accent); }
.pcard .pm { position: absolute; right: 5px; top: 5px; width: 32px; height: 32px; border-radius: 10px; background: rgba(255, 255, 255, .92); color: #334155; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.pcard .pm .ic { width: 18px; height: 18px; }
.pcard.add .th { display: grid; place-items: center; background: transparent; box-shadow: none; border: 2px dashed var(--line2); color: var(--text2); }
.pcard.add .th .ic { width: 34px; height: 34px; }

/* toasts */
#toasts { position: fixed; z-index: 100; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { pointer-events: auto; background: #1e2433; color: #fff; padding: 12px 14px 12px 18px; border-radius: 16px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); animation: tin .2s cubic-bezier(.2, .8, .2, 1); font-weight: 520; }
.toast.out { opacity: 0; transform: translateY(8px); transition: .25s; }
.toast button { color: #9db0ff; font-weight: 750; padding: 4px 8px; border-radius: 8px; }
@keyframes tin { from { opacity: 0; transform: translateY(10px) scale(.96); } }

/* ============ Library ============ */
#library { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; animation: fade .15s; }
.lib-head { padding: calc(14px + var(--safe-t)) calc(24px + var(--safe-r)) 10px calc(24px + var(--safe-l)); background: var(--bg); display: grid; gap: 12px; }
.lib-title { display: flex; align-items: center; gap: 10px; }
.lib-title h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; flex: 1; }
.lib-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1; min-width: 160px; position: relative; }
.search .ic { position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: var(--text3); }
.search input { width: 100%; height: 46px; border-radius: 14px; background: var(--surface); border: 2px solid transparent; padding: 0 14px 0 44px; outline: none; font-size: 15px; box-shadow: var(--shadow-sm); }
.search input:focus { border-color: var(--accent); }
.chips { display: flex; gap: 8px; }
.chip { height: 38px; padding: 0 16px; border-radius: 19px; background: var(--surface); font-weight: 650; color: var(--text2); box-shadow: var(--shadow-sm); }
.chip.on { background: var(--text); color: var(--bg); }

.crumbs button { padding: 4px 8px; border-radius: 8px; color: var(--accent); }
.crumbs span.cur { padding: 4px 8px; color: var(--text); }
.crumbs .sep { color: var(--text3); }
.lib-body { flex: 1; overflow-y: auto; padding: 8px calc(24px + var(--safe-r)) 60px calc(24px + var(--safe-l)); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.lib-sec { font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin: 20px 2px 12px; display: flex; gap: 8px; align-items: center; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.fcard { background: var(--surface); border-radius: 18px; padding: 14px 8px 14px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); text-align: left; }
.fcard:active { transform: scale(.98); }
.fcard .fi { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--fc) 18%, transparent); color: var(--fc); flex: none; }
.fcard .fi .ic { width: 24px; height: 24px; }
.fcard .ft { flex: 1; min-width: 0; } .fcard b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.fcard small { color: var(--text3); }
.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 22px 18px; }
.ncard { display: grid; gap: 10px; text-align: left; }
.ncard .cover { position: relative; aspect-ratio: 850/1100; border-radius: 6px 12px 12px 6px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .18), 0 10px 24px rgba(0, 0, 0, .12); transition: transform .18s; }
.ncard:active .cover { transform: scale(.97); }
.ncard .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ncard .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 11px; background: var(--nc); z-index: 2; }
.ncard .cover::after { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 3px; background: linear-gradient(90deg, rgba(0, 0, 0, .16), transparent); z-index: 2; }
.ncard .star { position: absolute; right: 6px; top: 6px; z-index: 3; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(255, 255, 255, .9); color: #64748b; box-shadow: 0 1px 4px rgba(0, 0, 0, .22); }

/* ============================================================
   CORE — constants, helpers, paper templates, stroke renderer,
   shape recognition and the IndexedDB storage layer.
   ============================================================ */
const PAGE_W = 850, PAGE_H = 1100;             // page units (unchanged → old notes still fit)
const GAP = 34, SIDE = 22, TOP_PAD = 88, ADD_H = 150, BOTTOM_PAD = 190;
const WORLD_W = PAGE_W + SIDE * 2;
const pageTop = i => TOP_PAD + i * (PAGE_H + GAP);

const $ = (s, r = document) => r.querySelector(s);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const r1 = v => Math.round(v * 10) / 10;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

function isDark(hex) {

    ctx.strokeStyle = line; ctx.lineWidth = .8; ctx.beginPath();

    ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(40, 78); ctx.lineTo(w - 40, 78); ctx.stroke();

    const q = this.q.trim().toLowerCase(), searching = !!q;
    const head = h('div', { class: 'lib-head' });
    const title = h('div', { class: 'lib-title' });
    if (S.tabs.length) title.append(h('button', { class: 'ibtn', 'aria-label': 'Back to notebook', onclick: () => this.close(), html: ic('chevL') }));
    title.append(h('h1', null, 'Library'),
      h('button', { class: 'btn', onclick: () => App.newFolder(this.folderId), html: ic('folderPlus') + '<span>Folder</span>' }),
      h('button', { class: 'btn primary', onclick: () => Dialogs.newNotebook(), html: ic('plus') + '<span>Notebook</span>' }),
      h('button', { class: 'ibtn', 'aria-label': 'Settings', onclick: () => Dialogs.settings(), html: ic('gear') }));
    const search = h('div', { class: 'search', html: ic('search') }, h('input', { type: 'search', placeholder: 'Search notebooks and folders', value: this.q, 'aria-label': 'Search' }));
    const inp = $('input', search); inp.addEventListener('input', () => { this.q = inp.value; this.renderBody(); });
    const chips = h('div', { class: 'chips' }); [['all', 'All'], ['starred', 'Starred'], ['recent', 'Recent']].forEach(([k, l]) => chips.append(h('button', { class: 'chip' + (this.filter === k ? ' on' : ''), onclick: () => { this.filter = k; this.q = ''; this.render(); } }, l)));
    head.append(title, h('div', { class: 'lib-tools' }, search, chips));
    this.crumbEl = h('div', { class: 'crumbs' }); head.append(this.crumbEl);
    this.body = h('div', { class: 'lib-body' }); root.append(head, this.body); this.renderBody();
  },
  renderBody() {
    const q = this.q.trim().toLowerCase(), body = this.body; body.innerHTML = '';
    const cr = this.crumbEl; cr.innerHTML = '';
    if (this.filter === 'all' && !q) {
      const path = this.crumbs();
      if (path.length) { cr.append(h('button', { onclick: () => { this.folderId = null; this.render(); } }, 'All notebooks')); path.forEach((f, i) => { cr.append(h('span', { class: 'sep' }, '›')); cr.append(i === path.length - 1 ? h('span', { class: 'cur' }, f.name) : h('button', { onclick: () => { this.folderId = f.id; this.render(); } }, f.name)); }); }
    }
    let folders = [], nbs = [];
    if (q) { folders = S.folders.filter(f => f.name.toLowerCase().includes(q)); nbs = S.notebooks.filter(n => n.title.toLowerCase().includes(q)); }
    else if (this.filter === 'starred') nbs = S.notebooks.filter(n => n.isFavorite);
    else if (this.filter === 'recent') nbs = S.notebooks.filter(n => n.openedAt).sort((a, b) => b.openedAt - a.openedAt).slice(0, 12);
    else { folders = S.folders.filter(f => (f.parentFolderId || null) === this.folderId); nbs = S.notebooks.filter(n => (n.folderId || null) === this.folderId); }
    if (this.filter !== 'recent') nbs = nbs.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    if (folders.length) {
      body.append(h('div', { class: 'lib-sec' }, 'Folders')); const g = h('div', { class: 'fgrid' });
      folders.forEach(f => {
        const cnt = S.notebooks.filter(n => n.folderId === f.id).length + S.folders.filter(x => x.parentFolderId === f.id).length;
        const card = h('div', { class: 'fcard', role: 'button', tabindex: 0 }, h('div', { class: 'fi', style: '--fc:' + f.color, html: ic('folder') }), h('div', { class: 'ft' }, h('b', null, f.name), h('small', null, cnt + (cnt === 1 ? ' item' : ' items'))),
          h('button', { class: 'ibtn', 'aria-label': 'Folder options', html: ic('more'), onclick: e => { e.stopPropagation(); UI.openPopover(e.currentTarget, this.folderMenu(f), { menu: true, below: true }); } }));
        card.addEventListener('click', () => { this.folderId = f.id; this.q = ''; this.filter = 'all'; this.render(); }); g.append(card);
      }); body.append(g);
    }
    if (nbs.length) {
      body.append(h('div', { class: 'lib-sec' }, this.filter === 'starred' ? 'Starred' : this.filter === 'recent' ? 'Recently opened' : 'Notebooks')); const g = h('div', { class: 'ngrid' });
      nbs.forEach(n => {
        const img = h('img', { alt: '', draggable: 'false' }), star = h('button', { class: 'star' + (n.isFavorite ? ' on' : ''), 'aria-label': 'Star', html: ic('star'), onclick: e => { e.stopPropagation(); n.isFavorite = !n.isFavorite; Persist.nb(n); star.classList.toggle('on', n.isFavorite); } });
        const card = h('div', { class: 'ncard', role: 'button', tabindex: 0 }, h('div', { class: 'cover', style: '--nc:' + n.color }, img, star),
          h('div', { class: 'meta' }, h('div', { class: 'tt' }, h('b', null, n.title), h('small', null, `${n.pages.length} page${n.pages.length > 1 ? 's' : ''} · ${ago(n.updatedAt)}`)),
            h('button', { class: 'ibtn', 'aria-label': 'Notebook options', html: ic('more'), onclick: e => { e.stopPropagation(); UI.openPopover(e.currentTarget, this.nbMenu(n), { menu: true, above: true }); } })));
        card.addEventListener('click', () => App.open(n.id)); g.append(card); UI.thumbAsync(n, n.pages[0], img, 300);
      }); body.append(g);
    }
    if (!folders.length && !nbs.length) body.append(h('div', { class: 'empty', html: ic('library') + `<div style="font-weight:650;font-size:16px;color:var(--text2)">${q ? 'No matches' : this.filter === 'starred' ? 'No starred notebooks yet' : this.filter === 'recent' ? 'Nothing opened yet' : 'This folder is empty'}</div><div style="margin-top:4px">${q ? 'Try a different search' : 'Tap “Notebook” to start writing'}</div>` }));
  },
  nbMenu(n) {
    const r = h('div'), mi = UI.menuItem.bind(UI);
    r.append(mi('rename', 'Rename', () => App.rename(n.id)), mi('star', n.isFavorite ? 'Remove star' : 'Add star', () => { n.isFavorite = !n.isFavorite; Persist.nb(n); this.renderBody(); }),
      mi('move', 'Move to…', () => App.moveTo(n)), mi('copy', 'Duplicate', () => App.duplicateNotebook(n.id)), mi('download', 'Export backup', () => App.exportJSON(n)),
      h('div', { class: 'mdiv' }), mi('trash', 'Delete', () => App.deleteNotebook(n.id), { danger: true })); return r;
  },
  folderMenu(f) {
    const r = h('div'), mi = UI.menuItem.bind(UI);
    r.append(mi('rename', 'Rename', () => App.renameFolder(f)), mi('trash', 'Delete folder', () => App.deleteFolder(f), { danger: true })); return r;
  },
};

/* ============================================================
   APP
   ============================================================ */
const App = {
  async boot() {
    UI.loadUiState(); UI.applyTheme();
    try { await Store.init(); } catch (e) { }
    let data = await Store.loadAll(); const byPg = new Map(); (data.pages || []).forEach(p => byPg.set(p.id, p));
    if (data.nbs && data.nbs.length) {
      S.notebooks = data.nbs.map(m => ({ ...m, pages: (m.pageIds || []).map(id => byPg.get(id)).filter(Boolean).map(p => ({ id: p.id, strokes: p.strokes || [], ...(p.template ? { template: p.template } : {}), ...(p.paperColor ? { paperColor: p.paperColor } : {}) })) }));
      S.notebooks.forEach(n => { if (!n.pages.length) n.pages.push(newPage()); });
      S.folders = data.folders || [];
    } else {
      const legacy = migrateLegacy();
      if (legacy) { S.notebooks = legacy.notebooks; S.folders = legacy.folders; S.notebooks.forEach(n => { Persist.nb(n); n.pages.forEach(p => Persist.page(n, p)); }); Persist.fol(); setTimeout(() => UI.toast('Your earlier notes were imported'), 900); }
    }
    UI.init(); Ed.init(); Sel.init(); Persist.flush();
    S.tabs = S.tabs.filter(id => getNb(id)); if (!getNb(S.activeId)) S.activeId = S.tabs[0] || null;
    if (!S.notebooks.length) { const nb = newNotebook({ title: 'My first notebook' }); S.notebooks.push(nb); Persist.nb(nb); Persist.page(nb, nb.pages[0]); S.tabs = [nb.id]; S.activeId = nb.id; }
    if (S.activeId) { this.open(S.activeId); if (!S.prefs.tipsSeen) { S.prefs.tipsSeen = true; UI.saveUiState(); setTimeout(() => Dialogs.tips(), 600); } } else Lib.open();
    $('#boot').remove();
    addEventListener('beforeunload', () => { Persist.flush(); Ed.saveView(); UI.saveUiState(); });
  },
  open(id) {
    const nb = getNb(id); if (!nb) return; if (!S.tabs.includes(id)) S.tabs.push(id); S.activeId = id; nb.openedAt = Date.now(); Persist.nb(nb);
    Lib.close(); Ed.mount(nb); UI.renderTabs(); UI.saveUiState();
  },
  closeTab(id) {
    const i = S.tabs.indexOf(id); if (i < 0) return; S.tabs.splice(i, 1);
    if (id === S.activeId) { const nx = S.tabs[Math.min(i, S.tabs.length - 1)]; if (nx) this.open(nx); else { S.activeId = null; Ed.saveView(); UI.renderTabs(); Lib.open(); } } else UI.renderTabs();
    UI.saveUiState();
  },
  createNotebook(o) { const nb = newNotebook(o); S.notebooks.push(nb); Persist.nb(nb); Persist.page(nb, nb.pages[0]); this.open(nb.id); },
  async rename(id) { const nb = getNb(id), v = await Dialogs.ask({ title: 'Rename notebook', value: nb.title }); if (v) { nb.title = v; Persist.nb(nb); UI.renderTabs(); if (!$('#library').hidden) Lib.renderBody(); } },
  async newFolder(parent) { const v = await Dialogs.ask({ title: 'New folder', value: 'New folder', ok: 'Create' }); if (!v) return; S.folders.push({ id: uid(), name: v, parentFolderId: parent || null, color: COVER_COLORS[S.folders.length % COVER_COLORS.length], createdAt: Date.now() }); Persist.fol(); Lib.renderBody(); },
  async renameFolder(f) { const v = await Dialogs.ask({ title: 'Rename folder', value: f.name }); if (v) { f.name = v; Persist.fol(); Lib.render(); } },
  async deleteFolder(f) {
    const ok = await Dialogs.confirm({ title: 'Delete folder “' + f.name + '”?', msg: 'Notebooks and folders inside will be moved up one level, not deleted.', ok: 'Delete folder', danger: true }); if (!ok) return;
    S.notebooks.forEach(n => { if (n.folderId === f.id) { n.folderId = f.parentFolderId || null; Persist.nb(n); } }); S.folders.forEach(x => { if (x.parentFolderId === f.id) x.parentFolderId = f.parentFolderId || null; });
    S.folders = S.folders.filter(x => x !== f); if (Lib.folderId === f.id) Lib.folderId = f.parentFolderId || null; Persist.fol(); Lib.render();
  },
  moveTo(n) {
    const list = h('div'), add = (id, name, depth) => list.append(h('button', { class: 'mi', style: 'padding-left:' + (12 + depth * 22) + 'px', onclick: () => { n.folderId = id; Persist.nb(n); Modal.close(); Lib.renderBody(); UI.toast('Moved to ' + name); }, html: ic(id ? 'folder' : 'library') + `<span>${name}</span>` + ((n.folderId || null) === id ? ic('check') : '') }));
    add(null, 'All notebooks', 0); const walk = (p, d) => S.folders.filter(f => (f.parentFolderId || null) === p).forEach(f => { add(f.id, f.name, d); walk(f.id, d + 1); }); walk(null, 1);
    Modal.open({ title: 'Move “' + n.title + '”', cls: 'dialog', body: list });
  },
  async deleteNotebook(id) {
    const nb = getNb(id); if (!nb) return; const ok = await Dialogs.confirm({ title: 'Delete “' + nb.title + '”?', msg: `This notebook and its ${nb.pages.length} page${nb.pages.length > 1 ? 's' : ''} will be removed.`, ok: 'Delete', danger: true }); if (!ok) return;
    const tabIdx = S.tabs.indexOf(id); S.notebooks = S.notebooks.filter(n => n !== nb); Persist.delNbs.add(id); nb.pages.forEach(p => Persist.pages.delete(p.id)); Persist.kick();
    if (tabIdx >= 0) { S.tabs.splice(tabIdx, 1); if (S.activeId === id) { S.activeId = null; if (S.tabs.length) { this.open(S.tabs[0]); Lib.open(); } else { UI.renderTabs(); } } else UI.renderTabs(); }
    Lib.renderBody(); UI.saveUiState();
    UI.toast('Notebook deleted', { ms: 7000, action: 'Undo', fn: () => { S.notebooks.push(nb); Persist.delNbs.delete(id); Persist.nb(nb); nb.pages.forEach(p => Persist.page(nb, p)); Lib.renderBody(); } });
  },
  duplicateNotebook(id) {
    const n = getNb(id), c = newNotebook({ ...metaOf(n), title: n.title + ' copy', openedAt: 0, isFavorite: false, pages: n.pages.map(p => newPage({ strokes: p.strokes.slice(), ...(p.template ? { template: p.template } : {}), ...(p.paperColor ? { paperColor: p.paperColor } : {}) })) });
    delete c.pageIds; S.notebooks.push(c); Persist.nb(c); c.pages.forEach(p => Persist.page(c, p)); Lib.renderBody(); UI.toast('Duplicated');
  },
  fullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else (document.documentElement.requestFullscreen || (() => { })).call(document.documentElement).catch(() => UI.toast('Full screen is not available here')); },

  /* ----- export ----- */
  download(blob, name) { const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); },
  safe(t) { return (t || 'notebook').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'notebook'; },
  pageCanvas(nb, page, k) { const c = document.createElement('canvas'); c.width = Math.round(PAGE_W * k); c.height = Math.round(PAGE_H * k); const x = c.getContext('2d'); x.scale(k, k); renderPage(x, page, nb); return c; },
  toBlob(c, type, q) { return new Promise(r => c.toBlob(r, type, q)); },
  async exportPNG(nb, i) { const b = await this.toBlob(this.pageCanvas(nb, nb.pages[i], 2), 'image/png'); this.download(b, `${this.safe(nb.title)}_p${i + 1}.png`); UI.toast('PNG saved to Downloads'); },
  async exportPDF(nb) {
    UI.toast('Building PDF…', { ms: 1500 }); const jpgs = [];
    for (const p of nb.pages) { const c = this.pageCanvas(nb, p, 1.7), b = await this.toBlob(c, 'image/jpeg', .9); jpgs.push({ w: c.width, h: c.height, data: new Uint8Array(await b.arrayBuffer()) }); await new Promise(r => setTimeout(r, 0)); }
    this.download(new Blob([buildPdf(jpgs)], { type: 'application/pdf' }), this.safe(nb.title) + '.pdf'); UI.toast('PDF saved to Downloads');
  },
  nbJSON(n) { return { ...metaOf(n), pageIds: undefined, pages: n.pages.map(p => ({ id: p.id, strokes: p.strokes, template: p.template, paperColor: p.paperColor })) }; },
  exportJSON(n) { this.download(new Blob([JSON.stringify({ format: 'notetab-notebook', version: 4, notebook: this.nbJSON(n) })], { type: 'application/json' }), this.safe(n.title) + '.notetab.json'); UI.toast('Backup saved'); },
  exportAll() { this.download(new Blob([JSON.stringify({ format: 'notetab-backup', version: 4, folders: S.folders, notebooks: S.notebooks.map(n => this.nbJSON(n)) })], { type: 'application/json' }), 'notetab-backup-' + new Date().toISOString().slice(0, 10) + '.json'); UI.toast('Full backup saved'); },
  pickImport() { const i = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' }); i.addEventListener('change', async () => { if (i.files[0]) await this.importFile(i.files[0]); i.remove(); }); document.body.append(i); i.click(); },
  async importFile(file) {
    try {
      const j = JSON.parse(await file.text()), fmap = new Map(); let count = 0;
      const addNb = o => {
        const pages = (o.pages || []).map(p => Array.isArray(p) ? newPage({ strokes: p }) : newPage({ strokes: p.strokes || [], ...(p.template ? { template: p.template } : {}), ...(p.paperColor ? { paperColor: p.paperColor } : {}) }));
        const nb = newNotebook({ title: o.title || 'Imported', color: o.color || '#3b5bdb', template: o.template || 'lined', paperColor: o.paperColor || '#ffffff', isFavorite: !!o.isFavorite, folderId: fmap.get(o.folderId) || null, openedAt: 0, pages: pages.length ? pages : [newPage()] });
        S.notebooks.push(nb); Persist.nb(nb); nb.pages.forEach(p => Persist.page(nb, p)); count++; return nb;
      };
      if (j.format === 'notetab-backup') { (j.folders || []).forEach(f => fmap.set(f.id, uid())); (j.folders || []).forEach(f => S.folders.push({ ...f, id: fmap.get(f.id), parentFolderId: fmap.get(f.parentFolderId) || null })); Persist.fol(); (j.notebooks || []).forEach(addNb); }
      else if (j.format === 'notetab-notebook') addNb(j.notebook);
      else if (Array.isArray(j)) j.forEach(addNb); else if (j.pages) addNb(j); else throw new Error('Unrecognised file');
      Modal.close(); Lib.open(); UI.toast(`Imported ${count} notebook${count === 1 ? '' : 's'}`);
    } catch (e) { UI.toast('That file could not be read'); console.error(e); }
  },
};

/* Minimal PDF writer: one JPEG per page (US Letter, same 8.5×11 ratio as the paper) */
function buildPdf(jpgs) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); push(body); push('\nendobj\n'); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'); const N = jpgs.length, kids = jpgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>'); obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${N} >>`);
  jpgs.forEach((j, i) => {
    const pg = 3 + i * 3, ct = pg + 1, im = pg + 2, cs = 'q 612 0 0 792 0 0 cm /Im0 Do Q';
    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im] = len; push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.data.length} >>\nstream\n`); push(j.data); push('\nendstream\nendobj\n');
  });
  const total = 3 + N * 3, xr = len; push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) push(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const out = new Uint8Array(len); let o = 0; parts.forEach(p => { out.set(p, o); o += p.length; }); return out;
}

addEventListener('DOMContentLoaded', () => App.boot().catch(e => { console.error(e); const b = $('#boot'); if (b) b.textContent = 'Could not start: ' + e.message; }));

</script>
